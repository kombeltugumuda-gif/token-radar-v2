<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="radar.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="8.5"/><circle cx="16" cy="16" r="3"/><path d="M16 16 L27 7"/></svg>
    <div>
      <h1>Token Radar</h1>
      <p id="sub" class="sub"></p>
    </div>
  </div>
  <dl id="kpis" class="kpis"></dl>
</header>

<section class="overview">
  <figure class="card chart">
    <figcaption><b>Implied value against TVL</b><span>each dot a protocol with no token recorded · log scales · click a dot</span></figcaption>
    <svg id="scatter" viewBox="0 0 640 300" role="img" aria-label="Scatter of implied value against TVL"></svg>
    <div class="legend"><i class="dot wl"></i>Watchlist <i class="dot ea"></i>Early find <i class="line"></i>Market median multiple</div>
  </figure>
  <aside class="card model" id="model"></aside>
</section>

<section class="card board">
  <div class="tabs" role="tablist">
    <button role="tab" data-view="board" aria-selected="true">Pre-token board</button>
    <button role="tab" data-view="live" aria-selected="false">Already trading</button>
  </div>
  <form id="filters" class="filters" autocomplete="off">
    <label class="grow">Search<input id="q" type="search" placeholder="Name, slug, category or chain"></label>
    <label>Family<select id="fam"></select></label>
    <label>Category<select id="cat"></select></label>
    <label>Chain<select id="chain"></select></label>
    <label>Min TVL<select id="mintvl">
      <option value="0">Any</option><option value="10000000">$10M+</option><option value="25000000">$25M+</option><option value="50000000">$50M+</option><option value="250000000">$250M+</option>
    </select></label>
    <div class="chips" id="seg">
      <button type="button" data-seg="all" class="on">All</button>
      <button type="button" data-seg="watchlist">Watchlist</button>
      <button type="button" data-seg="early">Early finds</button>
      <button type="button" data-seg="rising">Rising 7d</button>
    </div>
  </form>
  <p id="count" class="count" aria-live="polite"></p>
  <div class="scroll"><table id="table"></table></div>
  <p id="foot" class="foot"></p>
</section>

<div id="scrim" class="scrim" hidden></div>
<aside id="detail" class="drawer" aria-label="Protocol detail" hidden></aside>

<script src="../data.js"></script>
<script src="radar.js"></script>
</body>
</html>
